name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q -o "$(ls AetherClient-android-*.zip | sort -V | tail -1)"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Download Aether core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/aether AetherClient/app/src/main/jniLibs/arm64-v8a
          gh release download --repo CluvexStudio/Aether \
